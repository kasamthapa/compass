<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('compass-theme')
          var pref =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var resolved = pref === 'system' ? (systemDark ? 'dark' : 'light') : pref
          document.documentElement.setAttribute('data-theme', resolved)
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b17" />
    <!-- iOS home-screen install: standalone chrome, the compass-rose mark as
         the icon (via apple-touch-icon above), and the app's own name in the
         home-screen label. status-bar-style is a static iOS setting — unlike
         theme-color, iOS does not live-update it when the in-app theme
         toggle changes, so black-translucent (pairs with the dark theme,
         Compass's default) is the deliberate one-time choice. See
         DECISIONS.md. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Compass" />
    <title>Compass</title>
  </head>
  <body class="bg-bg text-text font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
